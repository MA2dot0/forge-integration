name: Build Android APK (Claude player)

# Builds a side-by-side installable "Forge (dev)" APK (package forge.app.dev, debug-signed) from this branch
# and attaches it to a GitHub release so it can be downloaded straight to a phone.

on:
  workflow_dispatch:
  push:
    branches: [ claude-player ]

jobs:
  build:
    if: github.repository_owner != 'Card-Forge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install old maven (3.8.1)
        run: |
          curl -sS -o apache-maven-3.8.1-bin.tar.gz https://archive.apache.org/dist/maven/maven-3/3.8.1/binaries/apache-maven-3.8.1-bin.tar.gz
          tar xf apache-maven-3.8.1-bin.tar.gz
          echo "$PWD/apache-maven-3.8.1/bin" >> $GITHUB_PATH
          echo "MAVEN_HOME=$PWD/apache-maven-3.8.1" >> $GITHUB_ENV

      - name: Set up Android tools
        run: |
          JAVA_HOME=${JAVA_HOME_17_X64} ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "build-tools;35.0.0" "platform-tools" "platforms;android-35"

      - name: Install Android maven plugin and build modules
        run: |
          mkdir -p ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          cd ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          curl -sSL -o android-maven-plugin-4.6.2.jar https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar
          curl -sSL -o android-maven-plugin-4.6.2.pom https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom
          cd -
          mvn -B install -Dmaven.test.skip=true

      - name: Build the dev APK
        run: |
          command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          export _JAVA_OPTIONS="-Xmx3g"
          mvn -U -B -P android-dev-build verify -e -Dandroid.sdk.path=$ANDROID_SDK_ROOT -Dandroid.buildToolsVersion=35.0.0 -Dmaven.test.skip=true
          mkdir upload
          cp forge-gui-android/target/*-signed*.apk upload/ || cp forge-gui-android/target/*.apk upload/
          ls -la upload

      - uses: actions/upload-artifact@v4
        with:
          name: forge-claude-apk
          path: upload/*.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: claude-apk-${{ github.run_number }}
          name: Forge with Claude player (build ${{ github.run_number }})
          body: |
            Debug-signed "Forge (dev)" APK built from the claude-player branch. Installs next to the normal Forge app.
            Set your API key in Settings > Claude AI player, then pick the "Claude" AI profile in Gameplay Options.
          files: upload/*.apk
          prerelease: true
